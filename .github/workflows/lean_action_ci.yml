name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # No placeholder proofs, no native_decide, no new axiom declarations.
      - name: Check forbidden constructs
        run: bash scripts/check_forbidden.sh
      # --wfail turns every warning into a build failure. QuantGrav/Audit.lean pins the
      # `#print axioms` output of each headline theorem, so a changed axiom set also fails here.
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
      - uses: leanprover-community/docgen-action@v1
