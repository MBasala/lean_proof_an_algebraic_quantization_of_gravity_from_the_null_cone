name = "quant_grav"
version = "0.1.0"
license = "MIT"
keywords = ["math"]
defaultTargets = ["QuantGrav"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# The header linter is part of mathlibStandardSet; its licence line is set to MIT here.
weak.linter.style.header.license = "Released under MIT license as described in the file LICENSE."
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "QuantGrav"
