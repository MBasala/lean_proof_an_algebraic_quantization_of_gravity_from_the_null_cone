name = "quant_grav"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["QuantGrav"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no licence chosen yet; see FIDELITY.md, open decisions
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "QuantGrav"
